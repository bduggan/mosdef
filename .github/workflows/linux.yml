name: Linux

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      matrix:
        os:
          - ubuntu-latest
        raku-version:
          - 'latest'
        rakuast:
          - false
          - true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Install Dependencies
        run: zef install --deps-only .
      - name: Run Tests
        run: |
          if [ "${{ matrix.rakuast }}" = "true" ]; then
            export RAKUDO_RAKUAST=1
          fi
          zef test -v .
